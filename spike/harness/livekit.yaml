# Spike 01 LiveKit server: loopback only, development keys, no TURN.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 0  # ICE-TCP binds every interface regardless of bind_addresses; off for the spike
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: secret-secret-secret-secret-secret0
logging:
  level: info
