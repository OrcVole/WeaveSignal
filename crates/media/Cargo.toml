[package]
name = "weavesignal-media"
description = "WeaveSignal's media worker: parses untrusted audio in a restricted process (the control binary's `media-worker`), measures its loudness, and writes clean FLAC (ADR-0048)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "pcm", "vorbis", "wav", "ogg", "aac", "isomp4"] }
ogg = "0.9.2"
opus-decoder = "0.1.1"
ebur128 = "0.1.10"
# Single-threaded (no `par`): the worker may start no threads (RLIMIT_NPROC is 0).
flacenc = { version = "0.5.1", default-features = false }
landlock = "0.4.7"
rustix = { version = "1.1.5", features = ["process"] }
# Stills for the video slate (ADR-0010): both pure Rust, read from the registry on 2026-11-02.
png = "0.18.1"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }

[lints]
workspace = true
