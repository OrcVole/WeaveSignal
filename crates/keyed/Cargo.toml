[package]
name = "weavesignal-keyed"
description = "WeaveSignal's keyed-show listening tokens: ECDSA P-256 signed, checked without a database (1.3.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The same ring the control plane and rustls already bring (ISC AND Apache-2.0).
ring = "0.17.14"
# Only to find a P-256 private key's public point, so the signer can be derived from a secret
# (ring needs both and cannot compute one from the other). Apache-2.0 OR MIT.
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
