[package]
name = "weavesignal-ingest"
description = "WeaveSignal's ingest (ADR-0280): takes a host's own software over Icecast and SRT with a show key, asks the control plane, decodes in a sandboxed worker per connection, and hands 48 kHz float to the desk over loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "weavesignal-ingest"
path = "src/main.rs"

[dependencies]
weavesignal-proto.workspace = true
weavesignal-mixer.workspace = true
weavesignal-media = { path = "../media" }
anyhow.workspace = true
base64.workspace = true
bytes = "1.12.1"
clap.workspace = true
futures = { version = "0.3.31", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
# The decoders the media worker already uses (ADR-0284: free decoders, never fdk-aac), with MPEG
# audio layer II added for MPEG-TS from hardware encoders.
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp2", "mp3", "vorbis", "ogg", "aac"] }
opus-decoder = "0.1.1"
# SRT in pure Rust, read from crates.io on 2026-11-15 (Apache-2.0, forbid(unsafe_code)): its
# listener picks the passphrase for each caller's stream id (the build's recce, verified against
# ffmpeg's libsrt). srt-protocol is named for KeySettings, which srt-tokio does not re-export.
srt-tokio = "=0.4.4"
srt-protocol = "=0.4.4"
# WHIP for remote DJs (17d): our own endpoint, ICE-lite on one UDP port, in pure sans-IO Rust
# (MIT OR Apache-2.0, read on crates.io 2026-11-20). Its default features also turn on its
# examples' web server; aws-lc-rs is its default DTLS and SRTP backend.
str0m = { version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "time", "sync", "rt-multi-thread", "macros"] }
# The bridge's WebSocket (Phase 17g), as the chat uses it: MIT, server side only.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Pulled sources (PLAN 17b): plain HTTP and HTTPS, Icecast and HLS. rustls with ring, and Mozilla's
# roots from webpki-roots: the operator's pick (2026-11-20), as the control plane's webhooks already
# use (ADR-0195); the licences (ISC, Apache-2.0, MIT, CDLA-Permissive-2.0) are in deny.toml.
ureq = { workspace = true, features = ["rustls"] }
# An HLS segment's address, relative to its playlist's (RFC 3986), as the control plane reads URLs.
url = "2.5.8"

[dev-dependencies]
# A local HTTPS server for the pull's tests, with a certificate made for each run (no key is kept
# in the repository). Both MIT OR Apache-2.0 (rustls: and ISC); ring as ureq's rustls uses.
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true

[lints]
workspace = true
