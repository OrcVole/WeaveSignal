<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->
  <!-- SPDX-FileCopyrightText: 2026 The WeaveSignal contributors -->
  <title id="t">How a WeaveSignal station's parts talk</title>
  <desc id="d">People in the room reach LiveKit over WebRTC. The desk joins LiveKit as a hidden participant, takes each voice in and sends each person a mix-minus back. The desk sends the programme over SRT on loopback to Liquidsoap playout, which sends PCM in WAV over loopback to the listener process; it holds the listener mount with icecast.server and serves listeners through the proxy. The studio app talks to the control plane over HTTPS; the control plane drives the desk over a Unix socket and keeps its data in PostgreSQL. The room and the desk are the conversation, about a quarter of a second each way over the internet; playout and the listener stream run seconds behind.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: #f3f4f8; stroke: #9aa0b4; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .zl { fill: #4a4f63; font-size: 13px; font-weight: 600; }
    .box { fill: #ffffff; stroke: #3d4256; stroke-width: 1.5; }
    .t { fill: #1a1b26; font-size: 15px; font-weight: 600; }
    .s { fill: #4a4f63; font-size: 12px; }
    .ln { stroke: #3d4256; stroke-width: 1.5; fill: none; }
    .lbl { fill: #2e3244; font-size: 12px; }
    .ah { fill: #3d4256; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1b26; }
      .zone { fill: #222433; stroke: #6b7089; }
      .zl { fill: #b8bdd6; }
      .box { fill: #1a1b26; stroke: #a9b1d6; }
      .t { fill: #e4e7f5; }
      .s { fill: #b8bdd6; }
      .ln { stroke: #a9b1d6; }
      .lbl { fill: #cfd3e8; }
      .ah { fill: #a9b1d6; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="520" rx="12"/>

  <!-- the two latencies -->
  <rect class="zone" x="10" y="16" width="514" height="258" rx="10"/>
  <text class="zl" x="24" y="36">Conversation: 69–77 ms on loopback, about 0.25 s each way online</text>
  <rect class="zone" x="588" y="160" width="402" height="252" rx="10"/>
  <text class="zl" x="602" y="180">Listeners: about 12 to 23 s behind</text>

  <!-- boxes -->
  <rect class="box" x="20" y="50" width="180" height="64" rx="8"/>
  <text class="t" x="110" y="78" text-anchor="middle">People in the room</text>
  <text class="s" x="110" y="98" text-anchor="middle">presenter, guests, callers</text>

  <rect class="box" x="330" y="50" width="180" height="64" rx="8"/>
  <text class="t" x="420" y="78" text-anchor="middle">LiveKit</text>
  <text class="s" x="420" y="98" text-anchor="middle">the live room, with TURN</text>

  <rect class="box" x="330" y="190" width="180" height="64" rx="8"/>
  <text class="t" x="420" y="218" text-anchor="middle">The desk</text>
  <text class="s" x="420" y="238" text-anchor="middle">Rust, GStreamer</text>

  <rect class="box" x="600" y="190" width="160" height="64" rx="8"/>
  <text class="t" x="680" y="218" text-anchor="middle">Playout</text>
  <text class="s" x="680" y="238" text-anchor="middle">Liquidsoap 2.5</text>

  <rect class="box" x="820" y="190" width="160" height="64" rx="8"/>
  <text class="t" x="900" y="218" text-anchor="middle">Listener process</text>
  <text class="s" x="900" y="238" text-anchor="middle">holds the mount</text>

  <rect class="box" x="820" y="330" width="160" height="64" rx="8"/>
  <text class="t" x="900" y="358" text-anchor="middle">Listeners</text>
  <text class="s" x="900" y="378" text-anchor="middle">any Ogg Opus player</text>

  <rect class="box" x="20" y="330" width="180" height="64" rx="8"/>
  <text class="t" x="110" y="358" text-anchor="middle">Studio app</text>
  <text class="s" x="110" y="378" text-anchor="middle">desk B, the screener</text>

  <rect class="box" x="330" y="330" width="180" height="64" rx="8"/>
  <text class="t" x="420" y="358" text-anchor="middle">Control plane</text>
  <text class="s" x="420" y="378" text-anchor="middle">Rust, Axum</text>

  <rect class="box" x="330" y="440" width="180" height="56" rx="8"/>
  <text class="t" x="420" y="464" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="420" y="483" text-anchor="middle">Unix socket only</text>

  <!-- links -->
  <line class="ln" x1="202" y1="82" x2="328" y2="82" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="265" y="72" text-anchor="middle">WebRTC</text>
  <text class="lbl" x="265" y="100" text-anchor="middle">one UDP port</text>

  <line class="ln" x1="420" y1="116" x2="420" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="430" y="148">each voice in;</text>
  <text class="lbl" x="430" y="164">a mix-minus back to each</text>

  <line class="ln" x1="512" y1="222" x2="598" y2="222" marker-end="url(#a)"/>
  <text class="lbl" x="555" y="212" text-anchor="middle">SRT</text>
  <text class="lbl" x="555" y="242" text-anchor="middle">loopback</text>

  <line class="ln" x1="762" y1="222" x2="818" y2="222" marker-end="url(#a)"/>
  <text class="lbl" x="790" y="212" text-anchor="middle">WAV</text>
  <text class="lbl" x="790" y="242" text-anchor="middle">loopback</text>

  <line class="ln" x1="900" y1="256" x2="900" y2="328" marker-end="url(#a)"/>
  <text class="lbl" x="890" y="296" text-anchor="end">through the proxy</text>

  <line class="ln" x1="202" y1="362" x2="328" y2="362" marker-end="url(#a)"/>
  <text class="lbl" x="265" y="352" text-anchor="middle">HTTPS</text>
  <text class="lbl" x="265" y="380" text-anchor="middle">live events</text>

  <line class="ln" x1="420" y1="328" x2="420" y2="256" marker-end="url(#a)"/>
  <text class="lbl" x="430" y="296">Unix socket, JSON lines</text>

  <line class="ln" x1="420" y1="396" x2="420" y2="438"/>
  <text class="lbl" x="430" y="422">SQL</text>
</svg>
