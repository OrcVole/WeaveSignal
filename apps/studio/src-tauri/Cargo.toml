[package]
name = "weavesignal-studio"
description = "WeaveSignal's studio app: Tauri v2 with the Svelte 5 interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "weavesignal-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
# Signed updates for the desktop packages (ADR-0015), read from crates.io on 2026-10-26.
# The platform's TLS (OpenSSL on Linux, SChannel on Windows) rather than rustls, whose ring and
# root-certificate crates carry ISC and CDLA licences deny.toml does not list; no zip, which only
# the Tauri 1 update format needs.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }
# `generate_context!` embeds the plugins' settings as JSON values.
serde_json.workspace = true
serde.workspace = true
# Requests to the station go out from Rust with its key (ADR-0121); the platform's TLS, as the
# updater's.
reqwest = { version = "0.12.28", default-features = false, features = ["native-tls"] }
# The address parser reqwest uses, named here for its `Host` (ADR-0139): already in the lock.
url = "2.5.8"

# The station's key in the system's keychain (ADR-0121): Secret Service over pure-Rust D-Bus on
# Linux (no libdbus to build against), Credential Manager on Windows, the Keychain on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-openssl"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
# Scratch folders for the rollback tests (already in the lock through the updater).
tempfile = "3.27.0"
# The feed test (tests/feed.rs, `just feed-test`) checks signatures with the crate the updater uses.
minisign-verify = "0.3.0"
base64 = "0.22.1"

[lints]
workspace = true
