# SPDX-License-Identifier: AGPL-3.0-only
# Licence and copyright for files that cannot carry a comment header (lock files, JSON, and
# documentation pages whose YAML frontmatter must come first), in the REUSE format.
# The licence texts are in LICENSES/.
#
# The code is AGPL-3.0-only (ADR-0073). The documentation's text and images are CC BY-SA 4.0;
# code samples and snippets inside the documentation pages stay AGPL-3.0-only, as the code is
# (ADR-0081). The documentation site's own code (its configuration and components) is code.
version = 1

[[annotations]]
path = [
  "Cargo.lock",
  "deploy/cloudron/CloudronManifest.json",
  "deploy/cloudron/CloudronVersions.json",
  "apps/studio/package.json",
  "apps/studio/pnpm-lock.yaml",
  "apps/studio/tsconfig.json",
  "apps/studio/src-tauri/tauri.conf.json",
  "apps/studio/src-tauri/capabilities/*.json",
  "apps/web/package.json",
  "apps/web/pnpm-lock.yaml",
  "apps/web/tsconfig.json",
  "docs/package.json",
  "docs/pnpm-lock.yaml",
  "playout/*.json",
  "docs/openapi/*.json",
  "tests/demo-video/script.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The WeaveSignal contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "docs/public/llms.txt",
  "docs/public/robots.txt",
  "docs/src/content/docs/**",
  "docs/src/data/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The WeaveSignal contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 AND AGPL-3.0-only"

# Screenshots of the running interface for the documentation (ADR-0081), written by tests/docs-shots/shoot.mjs,
# and the website's share picture (docs/public/og.png), cut from the desk's screenshot.
[[annotations]]
path = ["docs/src/assets/screens/*.png", "docs/public/og.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The WeaveSignal contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The website's faces: Noto Sans and Noto Sans Mono, subset to Latin from the unmodified releases
# in crates/cards/fonts (the faces the show cards are drawn in), as woff2.
[[annotations]]
path = ["docs/public/fonts/*.woff2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The AGPLv3 logo the Free Software Foundation publishes for marking works under the licence,
# from Wikimedia Commons ("File:AGPLv3_Logo.svg", artist: Free Software Foundation), which records
# it as public domain. A viewBox attribute was added so it scales; nothing else was changed. The
# mark is the FSF's trademark: it is shown to say the code is under the AGPL, and for nothing else.
[[annotations]]
path = ["docs/src/assets/agplv3-logo.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "LicenseRef-Public-Domain"

# The state chips and master lamps drawn for the documentation (ADR-0081): our own drawings,
# exported from the design system's section 3, one dark and one light file per chip and lamp.
# BANNED BEFORE still borrows FAULT's triangle until the operator picks its own.
[[annotations]]
path = ["docs/src/assets/states/*.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The WeaveSignal contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Two state glyphs are third-party icons (operator, 2026-11-02), set inside our CC BY-SA frame:
# DESK BUSY is Reicon's "hand", LINK DEGRADED is with icons' "signal-blueprint", both MIT.
[[annotations]]
path = ["docs/src/assets/states/*-desk-busy-*.svg"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 The WeaveSignal contributors", "2025 REICON"]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND MIT"

[[annotations]]
path = ["docs/src/assets/states/*-link-degraded-*.svg"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 The WeaveSignal contributors", "2026 with icons contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0 AND MIT"

# WeaveSignal's icon (ADR-0094): Boxicons' "broadcast" glyph (boxicons-core, MIT), as published
# and composed on the app's dark surface; the PNG and ICO sizes are generated from it with
# `tauri icon`.
[[annotations]]
path = [
  "packages/ui/icon/*.svg",
  "apps/studio/src-tauri/icons/*",
  "deploy/cloudron/logo.png",
  "docs/public/favicon.svg",
  "docs/src/assets/weavesignal-app-icon.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Boxicons"
SPDX-License-Identifier = "MIT"

# The default loop (assets/default-loop, ADR-0130): synthesised by make.sh from sine tones, our
# own work, given to the public domain so a station can keep, change or replace it freely. The
# script that makes it is code and carries its own AGPL-3.0-only header.
[[annotations]]
path = ["assets/default-loop/default-loop.flac"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The WeaveSignal contributors"
SPDX-License-Identifier = "CC0-1.0"

