#
# The tools the Tauri 2.12.4 bundler (tauri-bundler 2.10.4) downloads while it builds a package,
# pinned. build.sh runs fetch-tools.sh, which downloads each file named here for the platform
# being built, checks its SHA-256 and puts it in the bundler's tool cache; the bundler then finds
# it and downloads nothing. A file whose checksum differs is refused, never used.
#
# Columns: SHA-256, platform (linux or windows), path in the tool cache, URL.
# To move a pin (a new Tauri CLI, linuxdeploy or NSIS plugin), read the new URLs in the bundler's
# source (src/bundle/linux/appimage/linuxdeploy.rs, src/bundle/windows/nsis/mod.rs), download the
# files, and write their checksums here, in the same commit as the CLI's version.
#
# linuxdeploy-plugin-appimage: the bundler would fetch the moving "continuous" build, but only
# when its cache lacks the file; this pins the plugin's fixed release 1-alpha-20250213-1 (commit
# a96502d) in its place, so "continuous" is never fetched. The bundler treats the plugin as
# optional, so a build can drop its line and use linuxdeploy's built-in copy.
# nsis_tauri_utils.dll: on a Linux host the bundler finds no NSIS.exe in its NSIS directory,
# deletes the directory and downloads the DLL again, checked against its own SHA-1 pin (the same
# file, v0.5.3). This line's SHA-256 is a second check of that file, not the copy the bundler uses.
# The bundler overwrites three bytes of the linuxdeploy AppImage in the cache on every build, so
# fetch-tools.sh keeps the verified originals apart and copies them in afresh each time.
