# The listen-only route for a home network (1.3.1): a phone or another computer on the same
# network hears the station. Opt-in: `weavesignal.sh --lan` (or `--lan ADDRESS`) writes the
# settings this file reads and runs the bundle with it. By hand:
#
#   podman compose -f compose.yaml -f lan.yaml up -d
#
# It adds one small web server (Caddy, the one the public route uses) that listens on ONE
# address of this machine, in plain HTTP, on one port (LAN_PORT), and passes through only what
# a listener needs. Nothing else in the bundle changes: the control plane, the studio's API, the
# chat, LiveKit and the ingest stay on loopback, so the studio and its sign-in are not reachable
# from the network.
#
# What it passes (GET and HEAD only; everything else is answered 404 or 405 here, never sent on):
#   /                       the player page and its files (/assets/...)
#   /api/v1/player          what the page asks for to show the station and to find the stream
#   /api/v1/branding...     the station's name, colour, icon and banner
#   /api/v1/now-playing...  the title now playing (the open routes of the station's website)
#   /api/v1/public/...      the open routes for a station's website
#   /hls/...                the video, when the station has video on
#   /programme.opus         the listener process's mount, and the two MP3 mounts when they are on
#
# Not passed: the studio's API and sign-in, /setup/, /join/ (call-in and invitations), the chat,
# LiveKit's room, health, feeds and cards. Plain HTTP means a browser refuses a microphone here
# (it gives one only over HTTPS or on localhost), so nobody can call in over this route; it is
# for listening. To let anyone speak, publish the station with `--public`.
#
# Every port is a setting (ADR-0075): LAN_PORT (7300 unless taken). The address is LAN_ADDRESS.

services:
  lan:
    image: docker.io/library/caddy:2.11.7
    oom_score_adj: ${WEAVESIGNAL_OOM_SCORE_ADJ:-0}
    network_mode: host
    configs:
      - source: lan
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

configs:
  lan:
    content: |
      {
      	# No admin API (with host networking it would listen on the machine's loopback), no
      	# certificates, no redirect to HTTPS: this route is plain HTTP on one address.
      	admin off
      	auto_https off
      }

      http://${LAN_ADDRESS:?set LAN_ADDRESS (weavesignal.sh --lan does)}:${LAN_PORT:-7300} {
      	# Only this address, never every address of the machine.
      	bind ${LAN_ADDRESS}
      	header -Server
      	header X-Content-Type-Options nosniff

      	# Reading only. Anything that writes is refused here and never reaches the station.
      	# (A handle block of its own and first: handle blocks are tried in order and the first that
      	# matches answers, so a write never reaches the ones below.)
      	@write not method GET HEAD
      	handle @write {
      		respond 405
      	}

      	# The listener stream: only the mounts. A client asking for ICY metadata would get blocks
      	# spliced into the Ogg stream (bench 02), so the request header is dropped.
      	@stream path /programme.opus /${COMPAT_MOUNT:-programme.mp3} /${COMPAT_HIGH_MOUNT:-programme-high.mp3}
      	handle @stream {
      		reverse_proxy 127.0.0.1:${LISTENERS_PORT:-7312} {
      			header_up -Icy-MetaData
      			flush_interval -1
      		}
      	}

      	# The player and what it reads. The control plane answers only these from here.
      	@player {
      		path / /assets/* /api/v1/player /api/v1/branding /api/v1/branding/* /api/v1/now-playing /api/v1/now-playing/events /api/v1/public/* /hls/*
      	}
      	handle @player {
      		reverse_proxy 127.0.0.1:${CONTROL_PORT:-7310} {
      			flush_interval -1
      		}
      	}

      	# Everything else: the studio, its sign-in, setup, call-in and the chat are not served here.
      	handle {
      		respond "Not served on this address. This address is for listening: the station's studio is on the machine that runs it." 404
      	}
      }
