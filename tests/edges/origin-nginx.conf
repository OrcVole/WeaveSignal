#
# The stand-in HLS origin for `just test-edges`: bench 02's origin-nginx.conf (research/bench/
# 2026-10-24 in the project folder), serving the directory the test's encoder writes and
# logging every request so the origin's load can be counted. ORIGINPORT is replaced at start.
# The station's own HLS origin is the video path's (M5).
worker_processes 2;
pid /tmp/origin-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 8192; }
http {
  sendfile on; tcp_nopush on; keepalive_requests 100000;
  types { application/vnd.apple.mpegurl m3u8; video/mp4 mp4 m4s; }
  log_format bench '$msec $request_uri $status $body_bytes_sent';
  access_log /logs/origin.log bench;
  server {
    listen 127.0.0.1:ORIGINPORT reuseport;
    root /srv;
    # The station's health address, which an edge's /health passes through to (ADR-0160).
    location = /health { default_type text/plain; return 200 "ok\n"; }
    # What the control plane sends (crates/control/src/public.rs), not what the edge sends: a
    # stand-in with the edge's own values hid the edge passing both on (2026-11-03).
    location ~ \.m3u8$ { add_header Cache-Control "no-cache"; }
    location / { add_header Cache-Control "max-age=30"; }
  }
}
